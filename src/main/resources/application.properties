spring.application.name=EventReservationApp
server.port=9090
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/EventReservationApp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:LOCAL_PASSWORD_HERE}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=LOCAL_DEV_SECRET_DO_NOT_USE_IN_PROD
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000
